
services:
  mariadb:
    container_name: mariadb
    networks:
      - incepnet
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
    - mariadb:/var/lib/mysql
    restart: always

  nginx:
    container_name: nginx
    networks:
      - incepnet
    depends_on:
      - wordpress
      - phpmyadmin
    build:
      context: ./requirements/nginx
      dockerfile : Dockerfile
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
      - phpmyadmin:/var/www/phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    restart: always

  wordpress:
    container_name: wordpress
    networks:
      - incepnet
    depends_on:
      - mariadb
      - redis
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    restart: always

  redis:
    container_name: redis
    networks:
      - incepnet
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    restart: always

  phpmyadmin:
    container_name: phpmyadmin
    networks:
      - incepnet
    depends_on:
      - mariadb
    build:
      context: ./requirements/phpmyadmin
      dockerfile: Dockerfile
    volumes:
      - phpmyadmin:/var/www/phpmyadmin
    restart: always

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:?}/wordpress
  phpmyadmin:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:?}/phpmyadmin
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:?}/mariadb

networks:
  incepnet:
    driver: bridge
