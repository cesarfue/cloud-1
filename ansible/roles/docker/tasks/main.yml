---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repository

- name: Install Docker Engine and its plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: "{{ docker_repository.changed }}"
    lock_timeout: 600

- name: Start Docker and enable it at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
